plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'maven-publish'
}

// ========================================
// THÔNG TIN MOD
// ========================================

def minecraftVersion = project.findProperty('minecraft_version') ?: '1.21.11'
def yarnMappings = project.findProperty('yarn_mappings') ?: '1.21.11+build.4'
def loaderVersion = project.findProperty('loader_version') ?: '0.18.4'
def fabricApiVersion = project.findProperty('fabric_api_version') ?: '0.141.1+1.21.11'

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('maven_group') ?: 'vn.autobuild'

base {
    archivesName = project.findProperty('archives_base_name') ?: 'AutoBuild'
}

// ========================================
// REPOSITORIES
// ========================================

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }

    mavenCentral()
}

// ========================================
// DEPENDENCIES
// ========================================

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"

    mappings "net.fabricmc:yarn:${yarnMappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

// ========================================
// JAVA CONFIGURATION
// ========================================

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// ========================================
// RESOURCE PROCESSING
// ========================================

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version
        )
    }
}

// ========================================
// JAR CONFIGURATION
// ========================================

jar {
    from('LICENSE') {
        rename {
            "${it}_${base.archivesName.get()}"
        }
    }
}

// ========================================
// MAVEN PUBLISH
// ========================================

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
